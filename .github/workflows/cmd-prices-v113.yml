name: Publish CMD Woodworking Version 113 prices
on:
  push:
    paths:
      - '.github/workflows/cmd-prices-v113.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply prices while preserving live site files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path(".")
          style = """
          <style id="cmd-v113-price-style">
          .cmd-starting-price{display:inline-block;margin:8px 0 4px;padding:8px 12px;border:1px solid #c28b3a;border-radius:8px;background:#fff2d3;color:#3c270f;font:700 17px/1.3 Arial,Helvetica,sans-serif;box-shadow:0 1px 4px rgba(0,0,0,.12)}
          .cmd-starting-price small{display:block;font-size:12px;font-weight:600;margin-top:3px}
          </style>
          """
          script = """
          <script id="cmd-v113-prices">
          (function(){
            const prices = {
              'large wooden wavey flag':[100], 'large wooden wavy flag':[100],
              'medium wooden flag':[50], 'xs wooden flag':[15], 'can flag':[15],
              'deviled egg tray':[45], 'deviled egg trays':[45],
              'letter banks':[40], 'beauty tray':[30,'Without clear holders'],
              'beauty trays':[30,'Without clear holders'],
              'fresh egg trays':[25], 'fresh egg tray':[25],
              'pop top sign':[30], 'cigar tray':[40], 'cigar & whiskey tray':[40],
              'whiskey cigar tray':[40], 'pipe tray':[45], 'pool caddie':[50]
            };
            function updatePrices(){
              document.querySelectorAll('article.card').forEach(function(card){
                const body=card.querySelector('.card-body');
                const heading=body && body.querySelector('h3');
                if(!heading) return;
                const name=heading.textContent.trim().toLowerCase().replace(/\\s+/g,' ');
                const data=prices[name];
                if(!data) return;
                const old=body.querySelector('.price');
                if(old) old.remove();
                let label=body.querySelector('.cmd-starting-price');
                if(!label){
                  label=document.createElement('div');
                  label.className='cmd-starting-price';
                  const desc=body.querySelector('p');
                  (desc||heading).insertAdjacentElement('afterend',label);
                }
                const target='Starting at $'+data[0]+(data[1]?' · '+data[1]:'');
                if(label.textContent!==target) label.textContent=target;
              });
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',updatePrices,{once:true});
            else updatePrices();
            const observer=new MutationObserver(function(mutations){
              if(mutations.some(function(m){return Array.from(m.addedNodes).some(function(n){return n.nodeType===1 && !n.classList.contains('cmd-starting-price')})})) updatePrices();
            });
            observer.observe(document.body,{childList:true,subtree:true});
          })();
          </script>
          """
          for filename in ("index.html","products.html"):
              p=root/filename
              s=p.read_text(encoding="utf-8")
              assert "<html" in s.lower() and "</body>" in s.lower(),filename
              s,n=re.subn(r'<!-- CMD Woodworking Version #\\d+[^>]*-->', '<!-- CMD Woodworking Version #113 - Starting Prices Restored; retains existing products, photos, video, Our Story, and animations -->',s,count=1)
              if n==0: s=s.replace("<head>","<head>\n<!-- CMD Woodworking Version #113 - Starting Prices Restored -->",1)
              if filename=="products.html":
                  if 'cmd-v113-price-style' not in s: s=s.replace("</head>",style+"</head>",1)
                  if 'cmd-v113-prices' not in s: s=s.replace("</body>",script+"</body>",1)
                  assert "xs wooden flag" in s and "cmd-v113-prices" in s
              p.write_text(s,encoding="utf-8")
              print(filename, len(s), 'version113',s.count('Version #113'))
          (root/".github/workflows/cmd-prices-v113.yml").unlink()
          PY
      - name: Commit version 113 and remove temporary updater
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html products.html .github/workflows/cmd-prices-v113.yml
          git commit -m "CMD Woodworking v113: restore starting prices" || exit 0
          git push
